[project]
name = "quayzen-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2", "pgvector>=0.3",
  "pydantic-settings>=2.4", "pyjwt>=2.9", "httpx>=0.27", "python-multipart>=0.0.9", "cryptography>=43",
  "pypdf>=5.0", "python-docx>=1.1", "openpyxl>=3.1", "fastembed>=0.5", "boto3>=1.35",
]
[dependency-groups]
dev = ["pytest>=8"]
[tool.uv]
package = false
